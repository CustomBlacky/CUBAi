<!doctype html>
<html lang="tj">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CUBAi</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="logo">CUBAi</div>
      <div class="sub">Ёвари сунъии зеҳнӣ</div>
    </header>

    <section id="chat" class="chat">
      <div class="welcome">
        <h1>Салом 👋</h1>
        <p>Ман CUBAi ҳастам. Саволи худро нависед.</p>
      </div>
    </section>

    <form id="form" class="composer">
      <textarea id="input" rows="1" placeholder="Паёми худро нависед..." autocomplete="off"></textarea>
      <button type="submit">➤</button>
    </form>
  </main>
  <script src="/static/app.js"></script>

</html>
